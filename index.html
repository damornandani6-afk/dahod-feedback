<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Smart Review Portal</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #cbd5e1;
            --star-default: #cbd5e1;
            --star-active: #fbbf24;
            --primary: #1e3a8a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card { background: var(--card); width: 100%; max-width: 450px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8f0; }
        
        .header img { width: 65px; margin-bottom: 15px; }
        .header h2 { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
        .header p { color: var(--text-light); font-size: 14px; margin-bottom: 25px; }
        
        /* EXACT VIDEO STARS SETUP */
        .main-stars { display: flex; flex-direction: row-reverse; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .main-stars input { display: none; }
        .main-stars label { font-size: 48px; color: var(--star-default); cursor: pointer; transition: color 0.1s ease; }
        .main-stars label:hover, .main-stars label:hover ~ label, .main-stars input:checked ~ label { color: var(--star-active); }
        
        .instruction-text { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 10px; text-align: left; background-color: #f1f5f9; padding: 8px 12px; border-radius: 6px; display: inline-block; width: 100%; }
        
        /* EDITABLE/COPYABLE TEXT BOX FOR USER PRESS & HOLD */
        .copy-textarea { width: 100%; padding: 15px; border: 2px dashed #bbf7d0; background-color: #f0fdf4; border-radius: 12px; font-size: 15px; color: #1e293b; font-weight: 500; line-height: 1.5; resize: none; margin-bottom: 15px; outline: none; }
        .input-box { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; margin-bottom: 15px; resize: none; }
        
        .btn { background-color: var(--primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #1d4ed8; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
        <h2>Sunrise Public School</h2>
        <p>Official Institutional Quality Feedback</p>
    </div>

    <div class="main-stars">
        <input type="radio" name="rating" id="st5" value="5"><label for="st5">★</label>
        <input type="radio" name="rating" id="st4" value="4"><label for="st4">★</label>
        <input type="radio" name="rating" id="st3" value="3"><label for="st3">★</label>
        <input type="radio" name="rating" id="st2" value="2"><label for="st2">★</label>
        <input type="radio" name="rating" id="st1" value="1"><label for="st1">★</label>
    </div>

    <div id="happyPanel" class="hidden">
        <div class="instruction-text">👉 Press & Hold the text below to select and copy it:</div>
        <textarea class="copy-textarea" id="reviewText" rows="4" readonly>Excellent school environment! The teaching staff is highly professional, infrastructure is modern, and student safety protocols are extremely well managed. Highly recommended!</textarea>
        <button class="btn" onclick="openGoogleReview()">Open Google Maps to Paste</button>
    </div>

    <div id="sadPanel" class="hidden">
        <textarea class="input-box" id="complaintInput" rows="3" placeholder="Share your issues privately with school management..."></textarea>
        <button class="btn" onclick="submitPrivate()" style="background-color: #475569;">Submit Management Feedback</button>
    </div>
</div>

<script>
    // 100% FIXED SECURE WEB LINK FOR SUNRISE PUBLIC SCHOOL DAHOD
    const GOOGLE_TARGET_URL = "https://search.google.com/local/writereview?placeid=ChIJ88N6mGg_XjkR9G8pZ7l6G7Q";

    const starInputs = document.querySelectorAll('input[name="rating"]');
    
    starInputs.forEach(input => {
        input.addEventListener('change', () => {
            const score = parseInt(input.value);
            if(score >= 4) {
                document.getElementById('happyPanel').classList.remove('hidden');
                document.getElementById('sadPanel').classList.add('hidden');
            } else {
                document.getElementById('sadPanel').classList.remove('hidden');
                document.getElementById('happyPanel').classList.add('hidden');
            }
        });
    });

    function openGoogleReview() {
        // Direct absolute routing to prevent 404 browser glitch
        window.location.href = GOOGLE_TARGET_URL;
    }

    function submitPrivate() {
        alert("Thank you. Your critical feedback has been securely logged directly for administration troubleshooting.");
        location.reload();
    }
</script>
</body>
</html>
