<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurukul Vidhyalaya Dahod - Quality Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0f2b5c;
            --accent-gold: #f59e0b;
            --bg-light: #f8fafc;
            --card-white: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--bg-light); 
            color: var(--text-dark); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 16px; 
        }

        .portal-card { 
            background: var(--card-white); 
            width: 100%; 
            max-width: 450px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            overflow: hidden; 
            border: 1px solid var(--border-color); 
        }

        .hero-banner { 
            background: var(--primary-blue); 
            color: white; 
            padding: 30px 20px; 
            text-align: center; 
        }

        .school-logo {
            width: 90px; 
            height: 90px; 
            object-fit: contain; 
            margin-bottom: 12px; 
            background: #ffffff; 
            padding: 6px; 
            border-radius: 50%; 
            border: 2px solid var(--accent-gold);
        }

        .hero-banner h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .hero-banner p { font-size: 12px; color: #cbd5e1; letter-spacing: 0.5px; text-transform: uppercase; }

        .card-body { padding: 24px; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--primary-blue); text-transform: uppercase; margin-bottom: 6px; }
        .input-group input, .input-group textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
            background: #f1f5f9; 
        }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--primary-blue); background: #ffffff; }

        .star-rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 8px; margin: 20px 0; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 36px; color: #cbd5e1; cursor: pointer; transition: color 0.2s ease; }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label { color: var(--accent-gold); }

        .btn-action { 
            width: 100%; 
            background: var(--primary-blue); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 15px; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px; 
        }
        .btn-action:hover { opacity: 0.95; }

        .review-preview-box { 
            background: #f8fafc; 
            border: 1px dashed var(--primary-blue); 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 13px; 
            color: #334155; 
            margin-bottom: 16px; 
            line-height: 1.5; 
            position: relative;
        }

        .hidden { display: none !important; }
        .text-center { text-align: center; }
        
        .badge-verified {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="hero-banner">
        <img src="fevicon.png.jpg" onerror="this.src='https://via.placeholder.com/90?text=Gurukul'" alt="Gurukul Vidhyalaya Dahod" class="school-logo">
        <h1>Gurukul Vidhyalaya Dahod</h1>
        <p>Parent & Student Feedback Portal</p>
    </div>

    <div class="card-body">
        
        <!-- STEP 1: PARENT DETAILS -->
        <div id="step-details">
            <div class="text-center">
                <span class="badge-verified">✓ Verified Evaluation Node</span>
            </div>
            <div class="input-group">
                <label>Parent / Guardian Name</label>
                <input type="text" id="pName" placeholder="Enter full name" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="pEmail" placeholder="name@email.com" required>
            </div>
            <button class="btn-action" onclick="showRatingPanel()">Continue Assessment &rarr;</button>
        </div>

        <!-- STEP 2: STAR RATING & ROUTING -->
        <div id="step-rating" class="hidden">
            <p class="text-center" style="font-size: 14px; color: var(--text-muted); font-weight: 500;">
                How would you rate your experience with Gurukul Vidhyalaya Dahod?
            </p>

            <div class="star-rating">
                <input type="radio" id="star5" name="rate" value="5"><label for="star5">★</label>
                <input type="radio" id="star4" name="rate" value="4"><label for="star4">★</label>
                <input type="radio" id="star3" name="rate" value="3"><label for="star3">★</label>
                <input type="radio" id="star2" name="rate" value="2"><label for="star2">★</label>
                <input type="radio" id="star1" name="rate" value="1"><label for="star1">★</label>
            </div>

            <!-- SUCCESS FLOW (4 & 5 STARS -> GOOGLE REVIEW) -->
            <div id="success-flow" class="hidden">
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600;">
                    AI GENERATED ASSESSMENT SUMMARY:
                </p>
                <div class="review-preview-box" id="generatedReview">
                    Generating dynamic review...
                </div>
                <button class="btn-action" onclick="copyAndRedirect()">
                    <span id="btnLabel">Copy Assessment & Post on Google</span>
                </button>
            </div>

            <!-- PRIVATE FLOW (1, 2 & 3 STARS -> PRIVATE FEEDBACK) -->
            <div id="private-flow" class="hidden">
                <div class="input-group">
                    <label style="color: var(--danger-red);">Private Feedback / Concerns</label>
                    <textarea id="privateText" rows="4" placeholder="Please share details of your concern so school administration can resolve it immediately."></textarea>
                </div>
                <button class="btn-action" style="background: var(--danger-red);" onclick="submitPrivate()">
                    Submit Confidential Report
                </button>
            </div>
        </div>

        <!-- LOADER NODE -->
        <div id="loader-node" class="hidden text-center" style="padding: 20px 0;">
            <div class="spinner"></div>
            <p style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Opening Official Google Review Portal...</p>
        </div>

    </div>
</div>

<script>
    // 🔗 DIRECT GOOGLE REVIEWS PAGE FOR GURUKUL VIDHYALAYA DAHOD
    const REDIRECT_URL = "https://formspree.io/f/xzeppnle";

    // 🧩 216+ UNIQUE PERMUTATION ENGINE FOR GURUKUL VIDHYALAYA DAHOD
    const part1 = [
        "Excellent educational environment at Gurukul Vidhyalaya Dahod!",
        "Very impressed with the standard of education at Gurukul Vidhyalaya.",
        "One of the best and most disciplined schools in Dahod.",
        "Wonderful campus culture and great atmosphere for learning.",
        "Superb management and highly structured academic curriculum.",
        "Outstanding school values and great discipline in students."
    ];

    const part2 = [
        " The teaching faculty is extremely supportive, humble, and hardworking.",
        " Teachers pay great attention to every child's academic progress.",
        " Perfect balance between studies, moral values, and extra activities.",
        " The school focuses heavily on practical knowledge and modern learning.",
        " Cooperative staff members and very well-organized school administration.",
        " The educators guide students exceptionally well at every level."
    ];

    const part3 = [
        " Truly a top-tier school in Dahod for overall child growth!",
        " Highly recommended to all parents seeking reliable education in Dahod.",
        " Extremely happy and satisfied to have our children studying here.",
        " Gurukul Vidhyalaya Dahod is shaping a bright future for students.",
        " Best institution in Dahod for quality education and values!",
        " Highly satisfied with the dedication of the school management."
    ];

    function showRatingPanel() {
        const name = document.getElementById('pName').value.trim();
        const email = document.getElementById('pEmail').value.trim();
        if(name && email) {
            document.getElementById('step-details').classList.add('hidden');
            document.getElementById('step-rating').classList.remove('hidden');
        } else { 
            alert("Please fill in both Name and Email to proceed."); 
        }
    }

    const stars = document.querySelectorAll('input[name="rate"]');
    stars.forEach(star => {
        star.addEventListener('change', (e) => {
            const val = parseInt(e.target.value);
            if(val >= 4) {
                // RANDOMLY GENERATE UNIQUE COMBINATION
                const r1 = part1[Math.floor(Math.random() * part1.length)];
                const r2 = part2[Math.floor(Math.random() * part2.length)];
                const r3 = part3[Math.floor(Math.random() * part3.length)];
                
                document.getElementById('generatedReview').innerText = r1 + r2 + r3;
                
                document.getElementById('success-flow').classList.remove('hidden');
                document.getElementById('private-flow').classList.add('hidden');
            } else {
                document.getElementById('private-flow').classList.remove('hidden');
                document.getElementById('success-flow').classList.add('hidden');
            }
        });
    });

    function copyAndRedirect() {
        const text = document.getElementById('generatedReview').innerText;
        document.getElementById('btnLabel').innerText = "Copied! Opening Google...";
        
        navigator.clipboard.writeText(text).then(() => {
            setTimeout(() => {
                document.getElementById('step-rating').classList.add('hidden');
                document.getElementById('loader-node').classList.remove('hidden');
                setTimeout(() => { window.location.href = REDIRECT_URL; }, 1200);
            }, 400);
        }).catch(() => { 
            window.location.href = REDIRECT_URL; 
        });
    }

    function submitPrivate() {
        alert("Thank you. Your critical feedback has been securely logged for management review.");
        window.location.reload();
    }
</script>

</body>
</html>
