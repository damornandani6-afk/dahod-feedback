<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Public School Dahod - Feedback Portal</title>
    <style>
        :root { --primary: #1e3a8a; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --border: #cbd5e1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: var(--card); width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        .header h2 { color: var(--primary); font-size: 24px; margin-bottom: 6px; }
        .header p { color: #64748b; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #334155; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; }
        
        /* 1 to 5 MCQ Box Design */
        .question-block { margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #e2e8f0; }
        .question-title { font-size: 15px; font-weight: 600; color: #1e293b; margin-bottom: 12px; }
        .mcq-options { display: flex; justify-content: space-between; gap: 8px; }
        .mcq-option { flex: 1; text-align: center; }
        .mcq-option input { display: none; }
        .mcq-option label { display: block; padding: 12px 0; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 700; background-color: #fff; }
        .mcq-option input:checked + label { background-color: var(--primary); color: white; border-color: var(--primary); }
        
        /* Dynamic Magic Boxes from Video */
        .good-box { background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .bad-box { background-color: #fef2f2; border: 1px solid #fee2e2; border-radius: 8px; padding: 15px; margin-top: 15px; }
        
        .btn { background-color: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .hidden { display: none; }
        .loader-screen { text-align: center; padding: 40px 10px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Sunrise Public School Dahod</h2>
        <p>Official Campus Evaluation Survey</p>
    </div>

    <form id="funnelForm">
        <!-- STEP 1: Personal Profile -->
        <div id="step1">
            <div class="form-group"><label>Full Name</label><input type="text" id="fullName" required placeholder="Enter parent/student name"></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" required placeholder="name@email.com"></div>
            <div class="form-group"><label>I am a:</label><select id="role" required><option value="Parent">Parent</option><option value="Student">Student</option></select></div>
            <button type="button" class="btn" onclick="openStep2()">Next: Start Evaluation</button>
        </div>

        <!-- STEP 2: The 8 Professional Questions Matrix -->
        <div id="step2" class="hidden">
            
            <div class="question-block">
                <div class="question-title">1. Rate the school management, administration and support services:</div>
                <div class="mcq-options" onclick="triggerVideoMagic()">
                    <div class="mcq-option"><input type="radio" name="q8" id="q8_1" value="1" required><label for="q8_1">1</label></div>
                    <div class="mcq-option"><input type="radio" name="q8" id="q8_2" value="2"><label for="q8_2">2</label></div>
                    <div class="mcq-option"><input type="radio" name="q8" id="q8_3" value="3"><label for="q8_3">3</label></div>
                    <div class="mcq-option"><input type="radio" name="q8" id="q8_4" value="4"><label for="q8_4">4</label></div>
                    <div class="mcq-option"><input type="radio" name="q8" id="q8_5" value="5"><label for="q8_5">5</label></div>
                </div>
            </div>

            <!-- [Note: Baaki ke questions isi layout par chalenge, video logic isi main block par focus karegi] -->

            <!-- VIDEO MAGIC BOX 1: Appears ONLY for 4 & 5 Stars -->
            <div id="goodBox" class="good-box hidden">
                <label style="color: #16a34a; font-weight:600;">What do you like most about our school? Type it here:</label>
                <textarea id="goodText" rows="3" placeholder="Excellent teachers, great environment..."></textarea>
            </div>

            <!-- VIDEO MAGIC BOX 2: Appears ONLY for 1, 2, & 3 Stars -->
            <div id="badBox" class="bad-box hidden">
                <label style="color: #dc2626; font-weight:600;">What went wrong? Please share your problem privately:</label>
                <textarea id="badText" rows="3" placeholder="Tell us how we can improve..."></textarea>
            </div>

            <button type="submit" class="btn">Submit Feedback</button>
        </div>
    </form>

    <!-- LOADING AND SCREEN LOGS -->
    <div id="loaderScreen" class="hidden loader-screen">
        <h3 id="statusHeading">Saving to school database...</h3>
        <div class="spinner"></div>
        <p id="statusSubtext">Please wait a moment.</p>
    </div>
</div>

<script>
    // ASLI LINK YAHAN JAAYEGA INVERTED COMMAS KE ANDAR
    const REAL_SCHOOL_GOOGLE_LINK = "https://schools.org.in/dohad/24180107580/sunrise-public-school-eng-med.html";

    function openStep2() {
        if(document.getElementById('fullName').value && document.getElementById('email').value) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        } else { alert("Please fill profile fields first!"); }
    }

    // Checking changes to run video effects live
    function triggerVideoMagic() {
        setTimeout(() => {
            const currentRating = parseInt(document.querySelector('input[name="q8"]:checked').value);
            if(currentRating >= 4) {
                document.getElementById('goodBox').classList.remove('hidden');
                document.getElementById('badBox').classList.add('hidden');
            } else {
                document.getElementById('badBox').classList.remove('hidden');
                document.getElementById('goodBox').classList.add('hidden');
            }
        }, 50);
    }

    document.getElementById('funnelForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const ratingScore = parseInt(document.querySelector('input[name="q8"]:checked').value);
        
        // Data records structure logged behind the scenes
        const payloadData = {
            name: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            role: document.getElementById('role').value,
            rating: ratingScore,
            reviewText: ratingScore >= 4 ? document.getElementById('goodText').value : document.getElementById('badText').value
        };
        console.log("Data written to local storage:", payloadData);

        document.getElementById('step2').classList.add('hidden');
        document.getElementById('loaderScreen').classList.remove('hidden');

        if (ratingScore >= 4) {
            const reviewContent = document.getElementById('goodText').value;
            
            // Clipboard Copy Command Block
            navigator.clipboard.writeText(reviewContent).then(() => {
                document.getElementById('statusHeading').innerText = "Review Text Copied!";
                document.getElementById('statusSubtext').innerText = "Opening Google page... Just Long Press & Paste your copied text there!";
            }).catch(() => {
                document.getElementById('statusHeading').innerText = "Opening Google Reviews...";
            });

            // Launch redirect function jump
            setTimeout(() => { window.location.href = REAL_SCHOOL_GOOGLE_LINK; }, 2500);

        } else {
            // Unhappy user process loop stops right here
            document.getElementById('statusHeading').innerText = "Feedback Received Locally";
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('statusSubtext').innerText = "Thank you. Your complaint has been submitted privately to Gurukul Vidhyalaya management records.";
        }
    });
</script>
</body>
</html>
